        # highlights:
      - institution: Vrije Universiteit
        area: Computer Science
        degree: BSc
        date:
        start_date: 2020-09
        end_date: 2023-06
        location: Amsterdam, NL
        summary:
        highlights:
          - "Thesis: 'Assessment of SURF HPC Cloud: Viable Alternative to On-Premise Solutions?': 8.0/10"
    experience:
      - company: Kooistra Cyber Solutions
        position: Founder & Software Engineer
        start_date: 2025-01
        end_date: present
        location: Amsterdam, NL
        summary: Freelance software engineering for Dutch organisations, focused on secure and reliable data pipelines, APIs and system integrations in Rust and Python.
        highlights:
          - Designed and built a fault-tolerant CRM-to-portal synchronisation service in Rust on Azure. It is at-least-once, idempotent and fully resyncable, with a durable queue between reading and writing.
          - Built a state-aware, resumable migration framework in Rust that moves large media collections into a digital asset management system.
          - Built a data integration platform for scheduled, auditable syncs between business systems. This platform reuses an existing no-code workflow tool (n8n) as the front end, allowing non-technical users to build their own data pipelines.
          - Developed tooling around a digital asset management platform. This includes API client libraries, server-side plugins (PHP) and workflow automation for a media-archive client.
      - company: MovingMedia
        position: Systems Engineer
        start_date: 2023-10
        end_date: 2025-09
        location: Amsterdam, NL
        highlights:
          - Designed and implemented an automated ingest system for a digital asset management system, enabling secure and efficient archival of visual media. This system integrates the DAM with a collection system and ensures metadata consistency, checksum validation, and automated storage distribution.
          - Designed a rule-based, backup monitoring agent to automatically process alerts from an arbitrary system. Implemented for multiple client and internal systems.
      - company: MovingMedia
        position: Support Engineer
        start_date: 2019-10
        end_date: 2023-09
        location: Amsterdam, NL
        # highlights:
    # projects:
    skills:
      - label: Languages
        details: Rust, Python, PHP, C, JavaScript
      - label: Cloud & Data
        details: Azure (Functions, Container Apps, Queue/Table Storage), Dataverse, GCP (BigQuery)
      - label: Integration & Automation
        details: REST APIs, CI/CD
      - label: Tooling
        details: Nix/devenv, GitHub Actions, Docker

